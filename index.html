<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05050a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GORGE — Feed the Void</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js" defer></script>
<style>
:root{
  --void:#05050a; --panel:#0c0c17; --panel2:#11111f; --border:rgba(255,255,255,.08);
  --cyan:#2de2e6; --magenta:#ff3ea5; --gold:#ffc145; --text:#eef0fa; --dim:#8b8fa8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{margin:0;width:100%;height:100vh;height:100dvh;overflow:hidden;background:var(--void);
  font-family:'Space Grotesk',sans-serif;color:var(--text);touch-action:none;overscroll-behavior:none;
  position:fixed;inset:0;}
#game{position:fixed;inset:0;display:block;background:var(--void);}
.hidden{display:none !important;}
#errBanner{position:fixed;left:8px;right:8px;bottom:8px;z-index:999;background:#3a0d16;color:#ffb4c0;
  border:1px solid #6b1a2c;border-radius:10px;padding:10px 12px;font-size:11px;line-height:1.5;
  font-family:monospace;white-space:pre-wrap;display:none;max-height:40vh;overflow:auto;}
h1,h2,.num{font-family:'Orbitron',sans-serif;}

/* ---------- start screen ---------- */
#startScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 20%,#141428 0%,#05050a 60%);z-index:20;}
.orb{position:absolute;border-radius:50%;filter:blur(40px);opacity:.35;animation:drift 14s ease-in-out infinite;}
#panelCard{position:relative;width:min(420px,88vw);padding:34px 28px 28px;border-radius:22px;
  background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--border);
  box-shadow:0 20px 60px rgba(0,0,0,.5);text-align:center;}
#panelCard h1{font-size:38px;font-weight:900;margin:0 0 4px;letter-spacing:2px;
  background:linear-gradient(90deg,var(--cyan),var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent;}
.tagline{color:var(--dim);font-size:13px;letter-spacing:1px;margin-bottom:22px;text-transform:uppercase;}
#nameInput{width:100%;padding:13px 16px;border-radius:999px;border:1px solid var(--border);
  background:#08080f;color:var(--text);font-family:'Space Grotesk';font-size:15px;text-align:center;outline:none;margin-bottom:18px;}
#nameInput:focus{border-color:var(--cyan);}
.skinRow{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:22px;}
.skinArrow{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:#0e0e1a;
  color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#skinPreview{width:64px;height:64px;border-radius:50%;position:relative;box-shadow:0 0 30px 4px var(--skinGlow,rgba(45,226,230,.5));}
#skinPreview::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px dashed rgba(255,255,255,.35);animation:spin 6s linear infinite;}
#skinName{font-size:12px;color:var(--dim);margin-top:8px;letter-spacing:1px;}
#playBtn{width:100%;padding:15px;border:none;border-radius:999px;font-family:'Orbitron';font-weight:700;
  font-size:15px;letter-spacing:2px;cursor:pointer;color:#05050a;
  background:linear-gradient(90deg,var(--cyan),var(--magenta));box-shadow:0 8px 24px rgba(45,226,230,.25);}
#playBtn:active{transform:scale(.98);}
.modeRow{display:flex;gap:8px;margin-bottom:18px;}
.modeBtn{flex:1;padding:9px 4px;border-radius:12px;border:1px solid var(--border);background:#0e0e1a;
  color:var(--dim);font-size:11px;letter-spacing:.5px;cursor:pointer;}
.modeBtn.active{color:var(--void);background:linear-gradient(90deg,var(--cyan),var(--magenta));font-weight:600;}
.hint{font-size:11px;color:var(--dim);margin-top:16px;line-height:1.5;}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;}
#massBox{position:absolute;top:calc(16px + env(safe-area-inset-top));left:calc(16px + env(safe-area-inset-left));
  background:rgba(10,10,18,.6);border:1px solid var(--border);
  border-radius:14px;padding:10px 16px;backdrop-filter:blur(6px);}
#massBox .label{font-size:10px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;}
#massBox .val{font-size:24px;font-weight:700;}
#leaderboard{position:absolute;top:calc(16px + env(safe-area-inset-top));right:calc(16px + env(safe-area-inset-right));
  width:170px;background:rgba(10,10,18,.6);
  border:1px solid var(--border);border-radius:14px;padding:10px 12px;backdrop-filter:blur(6px);}
#leaderboard .title{font-size:10px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;}
#leaderboard ol{list-style:none;margin:0;padding:0;font-size:12px;}
#leaderboard li{display:flex;justify-content:space-between;padding:2px 0;color:var(--dim);}
#leaderboard li.me{color:var(--cyan);font-weight:600;}
#minimapWrap{position:absolute;left:calc(16px + env(safe-area-inset-left));bottom:calc(16px + env(safe-area-inset-bottom));
  width:104px;height:104px;border-radius:50%;
  overflow:hidden;border:1px solid var(--border);background:rgba(10,10,18,.6);}
#toast{position:absolute;top:calc(80px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:13px;color:var(--gold);
  opacity:0;transition:opacity .3s;font-weight:600;text-align:center;white-space:nowrap;}
#joyBase{position:absolute;width:100px;height:100px;border-radius:50%;border:2px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.03);display:none;}
#joyStick{position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.18);
  top:28px;left:28px;}

#actionCluster{position:absolute;right:calc(14px + env(safe-area-inset-right));bottom:calc(24px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:auto;}
.slotRow{display:flex;gap:10px;}
.slotBtn{position:relative;width:50px;height:50px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#1c1c2e,#0a0a14 70%);
  border:1.5px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,.45), inset 0 1px 1px rgba(255,255,255,.08);}
.slotBtn svg{width:22px;height:22px;}
.slotBtn.big{width:62px;height:62px;}
.slotBtn.big svg{width:26px;height:26px;}
.slotBtn .badge{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;
  background:var(--magenta);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;
  font-family:'Orbitron';box-shadow:0 0 0 2px var(--void);}
.slotBtn.empty{opacity:.32;}
.slotBtn:active{transform:scale(.92);}

/* ---------- death screen ---------- */
#deathScreen{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;
  background:rgba(5,5,10,.85);backdrop-filter:blur(4px);}
#deathCard{width:min(360px,86vw);padding:30px 26px;border-radius:20px;text-align:center;
  background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--border);}
#deathCard h2{margin:0 0 6px;font-size:22px;color:var(--magenta);letter-spacing:1px;}
#deathStats{margin:18px 0;font-size:13px;color:var(--dim);line-height:1.9;}
#deathStats b{color:var(--text);font-family:'Orbitron';}
.deathBtns{display:flex;gap:10px;}
.deathBtns button{flex:1;padding:13px;border-radius:999px;border:none;font-family:'Orbitron';
  font-weight:700;font-size:12px;letter-spacing:1px;cursor:pointer;}
#respawnBtn{background:linear-gradient(90deg,var(--cyan),var(--magenta));color:#05050a;}
#menuBtn{background:#15152a;color:var(--text);border:1px solid var(--border) !important;}

@keyframes spin{to{transform:rotate(360deg);}}
@keyframes drift{0%,100%{transform:translate(0,0);}50%{transform:translate(30px,-20px);}}
</style>
</head>
<body>

<canvas id="game"></canvas>
<div id="errBanner"></div>

<div id="startScreen">
  <div class="orb" style="width:260px;height:260px;background:var(--cyan);top:8%;left:5%;"></div>
  <div class="orb" style="width:220px;height:220px;background:var(--magenta);bottom:10%;right:6%;animation-delay:3s;"></div>
  <div id="panelCard">
    <h1>GORGE</h1>
    <div class="tagline">Feed the void · Become the maw</div>
    <input id="nameInput" maxlength="14" placeholder="Твоё имя">
    <div class="skinRow">
      <div class="skinArrow" id="skinPrev">‹</div>
      <div>
        <div id="skinPreview"></div>
        <div id="skinName">ПЛАЗМА</div>
      </div>
      <div class="skinArrow" id="skinNext">›</div>
    </div>
    <div class="modeRow">
      <div class="modeBtn active" data-mode="bots">АРЕНА С БОТАМИ</div>
      <div class="modeBtn" data-mode="trial">ТАЙМ-ТРИАЛ</div>
    </div>
    <button id="playBtn">В ПУСТОТУ</button>
    <div class="hint">Мышь / палец — движение · Пробел — раздвоиться · E — выброс массы<br>1/2/3 — щит / рывок / магнит из инвентаря</div>
  </div>
</div>

<div id="hud" class="hidden">
  <div id="massBox"><div class="label">Масса</div><div class="val num" id="massVal">20</div></div>
  <div id="leaderboard"><div class="title">Лидеры</div><ol id="lbList"></ol></div>
  <div id="minimapWrap"><canvas id="minimap" width="110" height="110"></canvas></div>
  <div id="toast"></div>
  <div id="joyBase"><div id="joyStick"></div></div>

  <div id="actionCluster">
    <div class="slotRow">
      <div class="slotBtn empty" id="shieldBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2de2e6" stroke-width="2" stroke-linejoin="round"><path d="M12 2l8 3v6c0 5-3.4 8.6-8 11-4.6-2.4-8-6-8-11V5l8-3z"/></svg>
        <div class="badge" id="shieldBadge">0</div>
      </div>
      <div class="slotBtn empty" id="surgeBtn">
        <svg viewBox="0 0 24 24" fill="#ff3ea5"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>
        <div class="badge" id="surgeBadge">0</div>
      </div>
      <div class="slotBtn empty" id="magnetBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffc145" stroke-width="2" stroke-linecap="round"><path d="M6 3v9a6 6 0 0 0 12 0V3"/><path d="M6 3H3v4h3"/><path d="M18 3h3v4h-3"/></svg>
        <div class="badge" id="magnetBadge">0</div>
      </div>
    </div>
    <div class="slotRow">
      <div class="slotBtn big" id="splitBtn">
        <svg viewBox="0 0 24 24"><circle cx="8" cy="12" r="5.5" fill="#2de2e6"/><circle cx="16" cy="12" r="5.5" fill="#ff3ea5" opacity=".85"/></svg>
      </div>
      <div class="slotBtn big" id="ejectBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="#eef0fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16V7M8 11l4-4 4 4"/></svg>
      </div>
    </div>
  </div>
</div>

<div id="deathScreen" class="hidden">
  <div id="deathCard">
    <h2>ТЫ ПОГЛОЩЁН</h2>
    <div id="deathStats"></div>
    <div class="deathBtns">
      <button id="respawnBtn">ВОЗРОДИТЬСЯ</button>
      <button id="menuBtn">В МЕНЮ</button>
    </div>
  </div>
</div>

<script>
'use strict';

/* ============ visible error reporting (never fail silently) ============ */
function showError(msg){
  const el = document.getElementById('errBanner');
  el.style.display = 'block';
  el.textContent = '⚠ ' + msg;
}
window.addEventListener('error', e=>{ showError((e.message||'Ошибка')+' ('+(e.filename||'')+':'+(e.lineno||'')+')'); });
window.addEventListener('unhandledrejection', e=>{ showError('Promise error: '+ (e.reason && e.reason.message || e.reason)); });

/* ============ Telegram Mini App bootstrap (safe no-op outside Telegram) ============ */
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor('#05050a'); tg.setBackgroundColor('#05050a'); } catch(e){} }
const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;

/* ============ constants ============ */
const WORLD = 4200;
const WORLD_CX = WORLD/2, WORLD_CY = WORLD/2, WORLD_R = WORLD/2;
const FOOD_COUNT = 220;
const BOT_COUNT = 11;
const POWERUP_MAX = 8;
const EAT_RATIO = 1.15;
const MIN_SPLIT_MASS = 44;
const MAX_CELLS = 4;
const MERGE_COOLDOWN = 30000;
const BLACKHOLE_START = 7;
const BLACKHOLE_MAX = 22;
const SHATTER_MIN_MASS = 30;
const INVENTORY_CAP = 5;
const SKINS = [
  {name:'ПЛАЗМА', c1:'#2de2e6', c2:'#0f5e8c'},
  {name:'ПЛАМЯ',  c1:'#ff8a3d', c2:'#c22a2a'},
  {name:'ТОКСИН', c1:'#b6ff3d', c2:'#2a7d2a'},
  {name:'НЕКРО',  c1:'#c56bff', c2:'#2a1a4a'},
  {name:'ЗЛАТО',  c1:'#ffd76b', c2:'#a8720d'},
  {name:'КРИО',   c1:'#c7f5ff', c2:'#3d7fa8'},
  {name:'РОЗА',   c1:'#ff6bc7', c2:'#7d1a5a'},
];
const BOT_NAMES = ['Керн','Нексус','Затмение','Пульсар','Квазар','Тень','Астер','Вихрь','Оникс','Фобос','Немезида','Горгона','Спектр','Дрейф','Морок','Апекс'];

function massToRadius(m){ return 18 + Math.sqrt(m)*2.6; }
function speedForRadius(r){ return Math.max(46, 210 * Math.pow(30/r, 0.45)); }
function rand(a,b){ return a + Math.random()*(b-a); }
function dist(x1,y1,x2,y2){ return Math.hypot(x1-x2,y1-y2); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function randomPointInWorld(margin){
  const R = Math.max(10, WORLD_R - margin);
  const ang = Math.random()*Math.PI*2;
  const rad = Math.sqrt(Math.random())*R;
  return {x:WORLD_CX+Math.cos(ang)*rad, y:WORLD_CY+Math.sin(ang)*rad};
}

/* ============ canvas setup ============ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let dpr = Math.min(window.devicePixelRatio||1, 2);
function resize(){
  dpr = Math.min(window.devicePixelRatio||1, 2);
  canvas.width = innerWidth*dpr; canvas.height = innerHeight*dpr;
  canvas.style.width = innerWidth+'px'; canvas.style.height = innerHeight+'px';
}
window.addEventListener('resize', resize); resize();
if(window.visualViewport){ window.visualViewport.addEventListener('resize', resize); }

const mini = document.getElementById('minimap').getContext('2d');

/* ============ game state ============ */
let state = 'menu'; // menu | playing | dead
let mode = 'bots';
let skinIdx = 0;
let playerName = tgUser && tgUser.first_name ? tgUser.first_name : 'Странник';

let entities = [];
let food = [];
let powerups = [];
let blackholes = [];
let ejected = [];    // {x,y,vx,vy,r,mass,color,owner,eatableAt}
let particles = [];
let cam = {x:WORLD_CX, y:WORLD_CY, zoom:1};
let player = null;
let lastTime = 0;
let sessionBest = 0;

const POWERUP_TYPES = [
  {id:'shield', label:'ЩИТ', color:'#2de2e6'},
  {id:'surge',  label:'РЫВОК', color:'#ff3ea5'},
  {id:'magnet', label:'МАГНИТ', color:'#ffc145'},
];

/* ============ setup world ============ */
function spawnFood(){
  food = [];
  for(let i=0;i<FOOD_COUNT;i++) food.push(makeFood());
}
function makeFood(){
  const p = randomPointInWorld(40);
  return {x:p.x, y:p.y, r:rand(4,7), color: SKINS[Math.floor(rand(0,SKINS.length))].c1};
}
function spawnPowerups(){
  powerups = [];
  for(let i=0;i<POWERUP_MAX;i++) powerups.push(makePowerup());
}
function makePowerup(){
  const t = POWERUP_TYPES[Math.floor(rand(0,POWERUP_TYPES.length))];
  const p = randomPointInWorld(80);
  return {x:p.x, y:p.y, r:13, type:t, phase:Math.random()*Math.PI*2};
}
function spawnBlackholes(){
  blackholes = [];
  for(let i=0;i<BLACKHOLE_START;i++){
    const p = randomPointInWorld(220);
    blackholes.push({x:p.x, y:p.y, r:rand(34,50), phase:Math.random()*Math.PI*2});
  }
}
function spawnBlackholeNear(bh){
  if(blackholes.length >= BLACKHOLE_MAX) return;
  for(let tries=0; tries<6; tries++){
    const ang = Math.random()*Math.PI*2, d = rand(140,260);
    const nx = bh.x+Math.cos(ang)*d, ny = bh.y+Math.sin(ang)*d;
    if(Math.hypot(nx-WORLD_CX, ny-WORLD_CY) < WORLD_R-100){
      blackholes.push({x:nx, y:ny, r:rand(30,46), phase:Math.random()*Math.PI*2});
      return;
    }
  }
}

function makeEntity(name, isBot, skin){
  const s = skin || SKINS[Math.floor(rand(0,SKINS.length))];
  const p = randomPointInWorld(300);
  return {
    id: Math.random().toString(36).slice(2),
    name, isBot, color1:s.c1, color2:s.c2, alive:true, bestMass:20,
    shieldUntil:0, surgeUntil:0, magnetUntil:0,
    aim:{x:1,y:0}, desiredAim:{x:1,y:0},
    inventory:{shield:0, surge:0, magnet:0},
    cells:[{ x:p.x, y:p.y, vx:0, vy:0, mass:20, mergeAt:0, faceAngle:0, hazardGraceUntil:0 }],
    ai:{ mode:'wander', target:{x:WORLD_CX,y:WORLD_CY}, nextThink:0 },
  };
}

function totalMass(e){ return e.cells.reduce((s,c)=>s+c.mass,0); }
function centroid(e){
  let tm=0,x=0,y=0;
  for(const c of e.cells){ x+=c.x*c.mass; y+=c.y*c.mass; tm+=c.mass; }
  return {x:x/tm, y:y/tm};
}

/* ============ start / reset ============ */
function resetGame(){
  spawnFood(); spawnPowerups(); spawnBlackholes(); ejected=[]; particles=[];
  entities = [];
  player = makeEntity(playerName || 'Странник', false, SKINS[skinIdx]);
  entities.push(player);
  for(let i=0;i<BOT_COUNT;i++){
    entities.push(makeEntity(BOT_NAMES[i%BOT_NAMES.length]+(i>=BOT_NAMES.length?' '+i:''), true));
  }
  const c = centroid(player);
  cam.x=c.x; cam.y=c.y; cam.zoom=2.2;
  sessionBest = 20;
  updateInventoryUI();
}

/* ============ input ============ */
let mouse = {x:innerWidth/2, y:innerHeight/2};
let touchAim = null;
window.addEventListener('mousemove', e=>{ mouse.x=e.clientX; mouse.y=e.clientY; });

const joyBase = document.getElementById('joyBase');
const joyStick = document.getElementById('joyStick');
let joyTouchId = null;
canvas.addEventListener('touchstart', e=>{
  for(const t of e.changedTouches){
    if(t.clientX < innerWidth*0.62 && joyTouchId===null){
      joyTouchId = t.identifier;
      joyBase.style.display='block';
      joyBase.style.left=(t.clientX-50)+'px'; joyBase.style.top=(t.clientY-50)+'px';
      joyStick.style.left='28px'; joyStick.style.top='28px';
    }
  }
}, {passive:true});
canvas.addEventListener('touchmove', e=>{
  for(const t of e.changedTouches){
    if(t.identifier===joyTouchId){
      const base = joyBase.getBoundingClientRect();
      const bx = base.left+50, by = base.top+50;
      let dx = t.clientX-bx, dy = t.clientY-by;
      const d = Math.hypot(dx,dy), max=44;
      if(d>max){ dx=dx/d*max; dy=dy/d*max; }
      joyStick.style.left=(28+dx)+'px'; joyStick.style.top=(28+dy)+'px';
      const len = Math.hypot(dx,dy)||1;
      touchAim = {x:dx/len, y:dy/len};
    }
  }
}, {passive:true});
function endJoy(e){
  for(const t of e.changedTouches){
    if(t.identifier===joyTouchId){ joyTouchId=null; joyBase.style.display='none'; touchAim=null; }
  }
}
canvas.addEventListener('touchend', endJoy);
canvas.addEventListener('touchcancel', endJoy);

window.addEventListener('keydown', e=>{
  if(state!=='playing') return;
  if(e.code==='Space'){ e.preventDefault(); doSplit(player); }
  if(e.code==='KeyE'){ doEject(player); }
  if(e.code==='Digit1'){ useInventoryItem('shield'); }
  if(e.code==='Digit2'){ useInventoryItem('surge'); }
  if(e.code==='Digit3'){ useInventoryItem('magnet'); }
});
function bindTap(el, fn){
  el.addEventListener('click', fn);
  el.addEventListener('touchstart', e=>{ e.preventDefault(); fn(); }, {passive:false});
}
bindTap(document.getElementById('splitBtn'), ()=>doSplit(player));
bindTap(document.getElementById('ejectBtn'), ()=>doEject(player));
bindTap(document.getElementById('shieldBtn'), ()=>useInventoryItem('shield'));
bindTap(document.getElementById('surgeBtn'), ()=>useInventoryItem('surge'));
bindTap(document.getElementById('magnetBtn'), ()=>useInventoryItem('magnet'));

/* ============ inventory ============ */
function updateInventoryUI(){
  if(!player) return;
  ['shield','surge','magnet'].forEach(t=>{
    const n = player.inventory[t]||0;
    document.getElementById(t+'Badge').textContent = n;
    document.getElementById(t+'Btn').classList.toggle('empty', n<=0);
  });
}
function useInventoryItem(type){
  if(!player || !player.alive) return;
  if(!player.inventory[type]) return;
  player.inventory[type]--;
  applyPowerup(player, type, performance.now());
  updateInventoryUI();
  const labelMap = {shield:'ЩИТ', surge:'РЫВОК', magnet:'МАГНИТ'};
  showToast(labelMap[type]+' АКТИВИРОВАН');
  if(tg && tg.HapticFeedback){ try{ tg.HapticFeedback.impactOccurred('medium'); }catch(e){} }
}

/* ============ mechanics ============ */
function doSplit(e){
  if(!e || !e.alive || e.cells.length>=MAX_CELLS) return;
  const now = performance.now();
  const newCells = [];
  for(const c of e.cells){
    if(c.mass >= MIN_SPLIT_MASS && e.cells.length+newCells.length < MAX_CELLS){
      const half = c.mass/2;
      c.mass = half;
      const ang = Math.atan2(e.aim.y, e.aim.x);
      const boost = 340;
      newCells.push({x:c.x, y:c.y, vx:Math.cos(ang)*boost, vy:Math.sin(ang)*boost, mass:half,
        mergeAt: now+MERGE_COOLDOWN, faceAngle:ang, hazardGraceUntil:0});
      c.mergeAt = now+MERGE_COOLDOWN;
    }
  }
  e.cells.push(...newCells);
}
function doEject(e){
  if(!e || !e.alive) return;
  let biggest = e.cells.reduce((a,b)=> a.mass>b.mass?a:b);
  if(biggest.mass < 26) return;
  biggest.mass -= 13;
  const ang = Math.atan2(e.aim.y, e.aim.x);
  const r = massToRadius(biggest.mass);
  ejected.push({
    x: biggest.x+Math.cos(ang)*r, y: biggest.y+Math.sin(ang)*r,
    vx: Math.cos(ang)*520, vy: Math.sin(ang)*520, r:7, mass:12,
    color:e.color1, owner:e, eatableAt: performance.now()+380
  });
}

/* ============ AI ============ */
function thinkBot(e, now){
  if(now < e.ai.nextThink) return;
  e.ai.nextThink = now + rand(280,480);
  const c = centroid(e);
  let threat=null, threatD=Infinity, prey=null, preyD=Infinity;
  for(const other of entities){
    if(other===e || !other.alive) continue;
    for(const cell of other.cells){
      const d = dist(c.x,c.y,cell.x,cell.y);
      if(cell.mass > totalMass(e)*EAT_RATIO && d<520 && d<threatD){ threat=cell; threatD=d; }
      if(cell.mass*EAT_RATIO < totalMass(e) && d<460 && d<preyD){ prey=cell; preyD=d; }
    }
  }
  let avoidHole=null, holeD=Infinity;
  for(const bh of blackholes){
    const d = dist(c.x,c.y,bh.x,bh.y);
    if(d < bh.r+160 && d<holeD){ avoidHole=bh; holeD=d; }
  }
  if(threat){
    e.ai.mode='flee';
    e.ai.target = {x: c.x-(threat.x-c.x), y: c.y-(threat.y-c.y)};
  } else if(avoidHole){
    e.ai.mode='avoid';
    e.ai.target = {x: c.x-(avoidHole.x-c.x), y: c.y-(avoidHole.y-c.y)};
  } else if(prey){
    e.ai.mode='hunt';
    e.ai.target = {x:prey.x, y:prey.y};
  } else {
    if(e.ai.mode!=='wander' || dist(c.x,c.y,e.ai.target.x,e.ai.target.y) < 60){
      let nearestFood=null, nd=Infinity;
      for(const f of food){ const d=dist(c.x,c.y,f.x,f.y); if(d<nd){nd=d; nearestFood=f;} }
      e.ai.mode='wander';
      e.ai.target = nearestFood ? {x:nearestFood.x,y:nearestFood.y} : randomPointInWorld(200);
    }
  }
  const dx = e.ai.target.x-c.x, dy = e.ai.target.y-c.y, len=Math.hypot(dx,dy)||1;
  e.desiredAim = {x:dx/len, y:dy/len};
}

/* ============ physics / collisions ============ */
function updateEntity(e, dt, now){
  const aimSmooth = 1 - Math.exp(-dt*8);
  e.aim.x += (e.desiredAim.x-e.aim.x)*aimSmooth;
  e.aim.y += (e.desiredAim.y-e.aim.y)*aimSmooth;
  const alen = Math.hypot(e.aim.x,e.aim.y)||1;
  e.aim.x/=alen; e.aim.y/=alen;

  for(const cell of e.cells){
    const r = massToRadius(cell.mass);
    let speed = speedForRadius(r);
    if(now < e.surgeUntil) speed *= 1.55;
    const targetVx = e.aim.x*speed, targetVy = e.aim.y*speed;
    const vSmooth = 1 - Math.exp(-dt*4.2);
    cell.vx += (targetVx-cell.vx)*vSmooth;
    cell.vy += (targetVy-cell.vy)*vSmooth;
    cell.x += cell.vx*dt; cell.y += cell.vy*dt;

    const dx0=cell.x-WORLD_CX, dy0=cell.y-WORLD_CY;
    const dd = Math.hypot(dx0,dy0);
    const maxR = WORLD_R - r;
    if(dd > maxR && dd>0){
      const k = maxR/dd;
      cell.x = WORLD_CX+dx0*k; cell.y = WORLD_CY+dy0*k;
      cell.vx *= 0.35; cell.vy *= 0.35;
    }
    const spd = Math.hypot(cell.vx,cell.vy);
    if(spd > 10) cell.faceAngle = Math.atan2(cell.vy,cell.vx);
  }

  // same-owner: merge after cooldown, otherwise gentle separation
  for(let i=0;i<e.cells.length;i++){
    for(let j=i+1;j<e.cells.length;j++){
      const a=e.cells[i], b=e.cells[j];
      const ra=massToRadius(a.mass), rb=massToRadius(b.mass);
      const d = dist(a.x,a.y,b.x,b.y)||0.01;
      const canMerge = now>a.mergeAt && now>b.mergeAt;
      if(canMerge){
        if(d < Math.max(ra,rb)*0.7){
          a.mass += b.mass; a.x=(a.x+b.x)/2; a.y=(a.y+b.y)/2;
          e.cells.splice(j,1); j--; continue;
        }
        const nx=(b.x-a.x)/d, ny=(b.y-a.y)/d, pull=8;
        a.x += nx*pull; a.y += ny*pull;
        b.x -= nx*pull; b.y -= ny*pull;
      } else if(d < ra+rb){
        const overlap = (ra+rb-d)/d*0.5;
        const ox=(a.x-b.x)*overlap, oy=(a.y-b.y)*overlap;
        a.x+=ox; a.y+=oy; b.x-=ox; b.y-=oy;
      }
    }
  }

  if(now < e.magnetUntil){
    const c = centroid(e);
    for(const f of food){
      const d = dist(c.x,c.y,f.x,f.y);
      if(d < 260){ f.x += (c.x-f.x)*0.06; f.y += (c.y-f.y)*0.06; }
    }
  }
}

function shatterCell(owner, cell, bh, now){
  const idx = owner.cells.indexOf(cell);
  if(idx===-1) return;
  const pushAngle = (cell.x===bh.x && cell.y===bh.y) ? Math.random()*Math.PI*2 : Math.atan2(cell.y-bh.y, cell.x-bh.x);
  if(cell.mass < SHATTER_MIN_MASS || owner.cells.length >= MAX_CELLS){
    cell.vx = Math.cos(pushAngle)*280; cell.vy = Math.sin(pushAngle)*280;
    cell.mass = Math.max(14, cell.mass*0.88);
    cell.hazardGraceUntil = now+800;
    if(owner===player) showToast('ОТБРОШЕН ОТ ЧЁРНОЙ ДЫРЫ');
    return;
  }
  const slots = Math.min(3, MAX_CELLS - owner.cells.length + 1);
  const fragMass = cell.mass/slots;
  owner.cells.splice(idx,1);
  for(let k=0;k<slots;k++){
    const ang = pushAngle + rand(-0.9,0.9);
    owner.cells.push({
      x:cell.x, y:cell.y, vx:Math.cos(ang)*320, vy:Math.sin(ang)*320,
      mass:fragMass, mergeAt: now+MERGE_COOLDOWN, faceAngle:ang, hazardGraceUntil: now+800
    });
  }
  if(owner===player) showToast('РАЗБИЛСЯ О ЧЁРНУЮ ДЫРУ');
}

function handleEating(now){
  // food
  for(const e of entities){
    if(!e.alive) continue;
    for(const cell of e.cells){
      const r = massToRadius(cell.mass);
      for(let i=food.length-1;i>=0;i--){
        const f = food[i];
        if(dist(cell.x,cell.y,f.x,f.y) < r){
          cell.mass += 1.1; food[i] = makeFood();
          if(e===player) spawnParticles(f.x,f.y,f.color,3);
        }
      }
    }
  }

  // ejected pellets: black holes reproduce if fed, otherwise normal eating
  for(let i=ejected.length-1;i>=0;i--){
    const p = ejected[i];
    p.x+=p.vx*(1/60); p.y+=p.vy*(1/60);
    p.vx*=0.92; p.vy*=0.92;

    let consumedByHole=false;
    for(const bh of blackholes){
      if(dist(p.x,p.y,bh.x,bh.y) < bh.r){
        consumedByHole=true;
        spawnBlackholeNear(bh);
        spawnParticles(bh.x,bh.y,'#c56bff',14);
        if(p.owner===player) showToast('ЧЁРНАЯ ДЫРА РАЗМНОЖИЛАСЬ');
        break;
      }
    }
    if(consumedByHole){ ejected.splice(i,1); continue; }

    if(now < p.eatableAt) continue;
    let eaten=false;
    for(const e of entities){
      if(!e.alive) continue;
      for(const cell of e.cells){
        const r = massToRadius(cell.mass);
        if(dist(cell.x,cell.y,p.x,p.y) < r){ cell.mass += p.mass; eaten=true; break; }
      }
      if(eaten) break;
    }
    if(eaten) ejected.splice(i,1);
  }

  // powerups -> player inventory, bots auto-use
  for(const e of entities){
    if(!e.alive) continue;
    for(const cell of e.cells){
      const r = massToRadius(cell.mass);
      for(let i=powerups.length-1;i>=0;i--){
        const pu = powerups[i];
        if(dist(cell.x,cell.y,pu.x,pu.y) < r+pu.r){
          if(e===player){
            player.inventory[pu.type.id] = Math.min(INVENTORY_CAP, (player.inventory[pu.type.id]||0)+1);
            showToast('+1 '+pu.type.label);
            updateInventoryUI();
          } else {
            applyPowerup(e, pu.type.id, now);
          }
          powerups.splice(i,1);
          if(powerups.length < POWERUP_MAX) powerups.push(makePowerup());
        }
      }
    }
  }

  // black holes: shatter big cells that ram in
  const shatterQueue = [];
  for(const e of entities){
    if(!e.alive) continue;
    for(const cell of e.cells){
      if(now < (cell.hazardGraceUntil||0)) continue;
      const r = massToRadius(cell.mass);
      for(const bh of blackholes){
        if(dist(cell.x,cell.y,bh.x,bh.y) < bh.r + r*0.55){
          shatterQueue.push({owner:e, cell, bh});
          break;
        }
      }
    }
  }
  for(const s of shatterQueue) shatterCell(s.owner, s.cell, s.bh, now);

  // entity vs entity
  for(const a of entities){
    if(!a.alive) continue;
    for(const acell of a.cells){
      const ar = massToRadius(acell.mass);
      for(const b of entities){
        if(b===a || !b.alive) continue;
        for(let k=b.cells.length-1;k>=0;k--){
          const bcell = b.cells[k];
          if(now < b.shieldUntil) continue;
          const br = massToRadius(bcell.mass);
          const d = dist(acell.x,acell.y,bcell.x,bcell.y);
          if(acell.mass > bcell.mass*EAT_RATIO && d < ar - br*0.6){
            acell.mass += bcell.mass*0.9;
            if(b===player) spawnParticles(bcell.x,bcell.y,b.color1,10);
            b.cells.splice(k,1);
            if(a===player) showToast('+'+Math.round(bcell.mass)+' МАССЫ');
          }
        }
      }
    }
  }
  for(const e of entities){
    if(e.cells.length===0 && e.alive){
      e.alive=false;
      if(e===player) onPlayerDeath();
    }
  }
}

function applyPowerup(e, id, now){
  if(id==='shield') e.shieldUntil = now+4000;
  if(id==='surge') e.surgeUntil = now+4000;
  if(id==='magnet') e.magnetUntil = now+5000;
}

/* ============ particles / toast ============ */
function spawnParticles(x,y,color,n){
  for(let i=0;i<n;i++){
    const a = rand(0,Math.PI*2), sp=rand(40,160);
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color});
  }
}
let toastTimer=null;
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.style.opacity=0; }, 1100);
}

/* ============ death / respawn ============ */
function onPlayerDeath(){
  document.getElementById('deathStats').innerHTML =
    'Достигнутая масса: <b>'+Math.round(sessionBest)+'</b><br>Ты был частью пустоты и вернулся в неё.';
  document.getElementById('deathScreen').classList.remove('hidden');
  state='dead';
}
document.getElementById('respawnBtn').addEventListener('click', ()=>{
  document.getElementById('deathScreen').classList.add('hidden');
  const idx = entities.indexOf(player);
  if(idx>=0) entities.splice(idx,1);
  player = makeEntity(playerName, false, SKINS[skinIdx]);
  entities.push(player);
  const c = centroid(player); cam.x=c.x; cam.y=c.y; cam.zoom=2.2;
  sessionBest = 20;
  updateInventoryUI();
  state='playing';
});
document.getElementById('menuBtn').addEventListener('click', ()=>{
  document.getElementById('deathScreen').classList.add('hidden');
  document.getElementById('startScreen').classList.remove('hidden');
  document.getElementById('hud').classList.add('hidden');
  state='menu';
});

/* ============ camera ============ */
function updateCamera(dt){
  if(!player || !player.alive || player.cells.length===0) return;
  const c = centroid(player);
  const tm = totalMass(player);
  const targetZoom = clamp(2.4 / Math.pow(tm/20, 0.32), 0.42, 2.4);
  cam.x += (c.x-cam.x)*Math.min(1,dt*4);
  cam.y += (c.y-cam.y)*Math.min(1,dt*4);
  cam.zoom += (targetZoom-cam.zoom)*Math.min(1,dt*3);
}

/* ============ render ============ */
function worldToScreen(x,y){
  return { x:(x-cam.x)*cam.zoom + innerWidth/2, y:(y-cam.y)*cam.zoom + innerHeight/2 };
}
function drawCell(cell, e, now){
  const p = worldToScreen(cell.x, cell.y);
  const r = massToRadius(cell.mass)*cam.zoom;
  if(p.x<-r||p.x>innerWidth+r||p.y<-r||p.y>innerHeight+r) return;
  const grad = ctx.createRadialGradient(p.x-r*0.3,p.y-r*0.3,r*0.1,p.x,p.y,r);
  grad.addColorStop(0, e.color1); grad.addColorStop(1, e.color2);
  ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2); ctx.fillStyle=grad; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.stroke();
  if(now < e.shieldUntil){
    ctx.beginPath(); ctx.arc(p.x,p.y,r+6,0,Math.PI*2);
    ctx.strokeStyle='rgba(45,226,230,.7)'; ctx.lineWidth=2; ctx.stroke();
  }
  if(r>22){
    ctx.fillStyle='rgba(255,255,255,.92)'; ctx.font='600 '+clamp(r*0.26,10,16)+'px Space Grotesk';
    ctx.textAlign='center'; ctx.fillText(e.name, p.x, p.y+4);
  }
}
function drawFacingArrow(p, r, angle){
  const tipX = p.x+Math.cos(angle)*(r+13), tipY = p.y+Math.sin(angle)*(r+13);
  const baseX = p.x+Math.cos(angle)*(r-3), baseY = p.y+Math.sin(angle)*(r-3);
  const perp = angle+Math.PI/2, w=7;
  ctx.beginPath();
  ctx.moveTo(tipX,tipY);
  ctx.lineTo(baseX+Math.cos(perp)*w, baseY+Math.sin(perp)*w);
  ctx.lineTo(baseX-Math.cos(perp)*w, baseY-Math.sin(perp)*w);
  ctx.closePath();
  ctx.fillStyle='rgba(255,255,255,.92)';
  ctx.fill();
}
function render(now){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,innerWidth,innerHeight);
  ctx.fillStyle='#05050a'; ctx.fillRect(0,0,innerWidth,innerHeight);

  // polar radar grid, screen-space, always centered on the player
  ctx.save();
  const ringGap=90, maxRpx=Math.hypot(innerWidth,innerHeight)/2+ringGap;
  ctx.strokeStyle='rgba(255,255,255,.06)'; ctx.lineWidth=1;
  for(let rr=ringGap; rr<maxRpx; rr+=ringGap){
    ctx.beginPath(); ctx.arc(innerWidth/2, innerHeight/2, rr, 0, Math.PI*2); ctx.stroke();
  }
  ctx.strokeStyle='rgba(255,255,255,.045)';
  for(let a=0;a<Math.PI*2-0.01;a+=Math.PI/6){
    ctx.beginPath();
    ctx.moveTo(innerWidth/2, innerHeight/2);
    ctx.lineTo(innerWidth/2+Math.cos(a)*maxRpx, innerHeight/2+Math.sin(a)*maxRpx);
    ctx.stroke();
  }
  ctx.restore();

  // world edge (circle)
  const wc = worldToScreen(WORLD_CX,WORLD_CY);
  ctx.beginPath(); ctx.arc(wc.x,wc.y,WORLD_R*cam.zoom,0,Math.PI*2);
  ctx.strokeStyle='rgba(255,62,165,.28)'; ctx.lineWidth=3; ctx.stroke();

  // black holes
  for(const bh of blackholes){
    const p = worldToScreen(bh.x,bh.y);
    const r = bh.r*cam.zoom;
    if(p.x<-r-40||p.x>innerWidth+r+40||p.y<-r-40||p.y>innerHeight+r+40) continue;
    const grad = ctx.createRadialGradient(p.x,p.y,r*0.15,p.x,p.y,r*1.35);
    grad.addColorStop(0,'#000000'); grad.addColorStop(0.55,'#0a0016'); grad.addColorStop(1,'rgba(120,40,200,0)');
    ctx.beginPath(); ctx.arc(p.x,p.y,r*1.35,0,Math.PI*2); ctx.fillStyle=grad; ctx.fill();
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2); ctx.fillStyle='#000'; ctx.fill();
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(now/1400+bh.phase);
    ctx.beginPath(); ctx.setLineDash([r*0.5,r*0.35]);
    ctx.arc(0,0,r*1.12,0,Math.PI*1.5);
    ctx.strokeStyle='rgba(197,107,255,.55)'; ctx.lineWidth=3; ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
  }

  // food
  for(const f of food){
    const p = worldToScreen(f.x,f.y);
    if(p.x<-10||p.x>innerWidth+10||p.y<-10||p.y>innerHeight+10) continue;
    ctx.beginPath(); ctx.arc(p.x,p.y,f.r*cam.zoom,0,Math.PI*2); ctx.fillStyle=f.color; ctx.globalAlpha=.85; ctx.fill(); ctx.globalAlpha=1;
  }
  // powerups
  for(const pu of powerups){
    const p = worldToScreen(pu.x,pu.y);
    const pulse = 1+Math.sin(now/300+pu.phase)*0.15;
    ctx.beginPath(); ctx.arc(p.x,p.y,pu.r*cam.zoom*pulse,0,Math.PI*2);
    ctx.fillStyle=pu.type.color; ctx.globalAlpha=.9; ctx.fill(); ctx.globalAlpha=1;
    ctx.beginPath(); ctx.arc(p.x,p.y,pu.r*cam.zoom*pulse+5,0,Math.PI*2);
    ctx.strokeStyle=pu.type.color+'55'; ctx.lineWidth=2; ctx.stroke();
  }
  // ejected pellets
  for(const pl of ejected){
    const p = worldToScreen(pl.x,pl.y);
    ctx.beginPath(); ctx.arc(p.x,p.y,pl.r*cam.zoom,0,Math.PI*2); ctx.fillStyle=pl.color; ctx.fill();
  }
  // particles
  for(let i=particles.length-1;i>=0;i--){
    const pt = particles[i];
    pt.x+=pt.vx*0.016; pt.y+=pt.vy*0.016; pt.life-=0.025;
    if(pt.life<=0){ particles.splice(i,1); continue; }
    const p = worldToScreen(pt.x,pt.y);
    ctx.beginPath(); ctx.arc(p.x,p.y,3*cam.zoom*pt.life,0,Math.PI*2);
    ctx.fillStyle=pt.color; ctx.globalAlpha=pt.life; ctx.fill(); ctx.globalAlpha=1;
  }
  // entities, smallest first
  const allCells=[];
  for(const e of entities){ if(e.alive) for(const c of e.cells) allCells.push({c,e}); }
  allCells.sort((a,b)=>a.c.mass-b.c.mass);
  for(const {c,e} of allCells) drawCell(c,e,now);

  // player: direction arrows + event-horizon signature ring
  if(player && player.alive){
    for(const c of player.cells){
      const p = worldToScreen(c.x,c.y);
      const r = massToRadius(c.mass)*cam.zoom;
      drawFacingArrow(p, r, c.faceAngle||0);
    }
    const c = centroid(player);
    const p = worldToScreen(c.x,c.y);
    const r = massToRadius(totalMass(player))*cam.zoom;
    const pulse = 1+Math.sin(now/ (600+totalMass(player)*4))*0.06;
    ctx.beginPath(); ctx.setLineDash([6,10]);
    ctx.arc(p.x,p.y,r*pulse+14,0,Math.PI*2);
    ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=1.4; ctx.stroke();
    ctx.setLineDash([]);
  }

  // minimap
  mini.clearRect(0,0,110,110);
  mini.beginPath(); mini.arc(55,55,54,0,Math.PI*2); mini.fillStyle='rgba(255,255,255,.03)'; mini.fill();
  const s = 106/WORLD;
  for(const bh of blackholes){
    mini.beginPath(); mini.arc(2+bh.x*s, 2+bh.y*s, 1.5, 0, Math.PI*2);
    mini.fillStyle='rgba(197,107,255,.7)'; mini.fill();
  }
  for(const e of entities){
    if(!e.alive) continue;
    const c = centroid(e);
    mini.beginPath();
    mini.arc(2+c.x*s, 2+c.y*s, e===player?3.2:1.6, 0, Math.PI*2);
    mini.fillStyle = e===player ? '#2de2e6' : 'rgba(255,255,255,.35)';
    mini.fill();
  }
}

/* ============ HUD updates ============ */
let lbTimer=0;
function updateHud(now, dt){
  if(!player || !player.alive) return;
  const tm = totalMass(player);
  sessionBest = Math.max(sessionBest, tm);
  document.getElementById('massVal').textContent = Math.round(tm);
  lbTimer -= dt;
  if(lbTimer<=0){
    lbTimer = 0.35;
    const ranked = entities.filter(e=>e.alive).map(e=>({e, m:totalMass(e)})).sort((a,b)=>b.m-a.m);
    const top = ranked.slice(0,6);
    let html='';
    top.forEach((r,i)=>{
      html += '<li class="'+(r.e===player?'me':'')+'"><span>'+(i+1)+'. '+r.e.name+'</span><span>'+Math.round(r.m)+'</span></li>';
    });
    if(!top.find(r=>r.e===player)){
      const myRank = ranked.findIndex(r=>r.e===player)+1;
      html += '<li class="me">'+myRank+'. '+player.name+' <span>'+Math.round(tm)+'</span></li>';
    }
    document.getElementById('lbList').innerHTML = html;
  }
}

/* ============ main loop ============ */
function loop(ts){
  requestAnimationFrame(loop);
  if(state!=='playing') return;
  try{
    const now = performance.now();
    const dt = lastTime ? Math.min((ts-lastTime)/1000, 0.05) : 0.016;
    lastTime = ts;

    if(!player) return;
    if(touchAim){
      player.desiredAim = {x:touchAim.x, y:touchAim.y};
    } else {
      const dx = mouse.x-innerWidth/2, dy = mouse.y-innerHeight/2;
      const len = Math.hypot(dx,dy)||1;
      player.desiredAim = {x:dx/len, y:dy/len};
    }

    for(const e of entities){
      if(!e.alive) continue;
      if(e.isBot) thinkBot(e, now);
      updateEntity(e, dt, now);
    }
    handleEating(now);
    updateCamera(dt);
    updateHud(now, dt);
    render(now);
  } catch(err){
    showError('Игровой цикл: '+err.message);
  }
}
requestAnimationFrame(loop);

/* ============ start screen wiring ============ */
document.getElementById('nameInput').value = playerName;
document.getElementById('nameInput').addEventListener('input', e=>{ playerName = e.target.value.trim() || 'Странник'; });

function renderSkinPreview(){
  const s = SKINS[skinIdx];
  const el = document.getElementById('skinPreview');
  el.style.background = 'radial-gradient(circle at 35% 30%,'+s.c1+','+s.c2+')';
  el.style.setProperty('--skinGlow', s.c1+'88');
  document.getElementById('skinName').textContent = s.name;
}
renderSkinPreview();
document.getElementById('skinPrev').onclick = ()=>{ skinIdx=(skinIdx-1+SKINS.length)%SKINS.length; renderSkinPreview(); };
document.getElementById('skinNext').onclick = ()=>{ skinIdx=(skinIdx+1)%SKINS.length; renderSkinPreview(); };

document.querySelectorAll('.modeBtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.modeBtn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); mode = btn.dataset.mode;
  });
});

document.getElementById('playBtn').addEventListener('click', ()=>{
  try{
    if(tg && tg.HapticFeedback){ try{ tg.HapticFeedback.impactOccurred('light'); }catch(e){} }
    const de = document.documentElement;
    if(de.requestFullscreen) de.requestFullscreen().catch(()=>{});
    else if(de.webkitRequestFullscreen) de.webkitRequestFullscreen();
    resize();
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    resetGame();
    state='playing';
  } catch(err){
    showError('Запуск игры: '+err.message);
  }
});
</script>
